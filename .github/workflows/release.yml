name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and upload (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Call electron-builder with --publish never here so CI never asks for GH_TOKEN, even if an
      # older tag points at a commit whose package.json still has `npm run build:win` without never.
      - name: Build app + NSIS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm run build
          npx electron-builder --win nsis --publish never

      - name: Sign executables with Authenticode (optional)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          PFX_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            Write-Host "WINDOWS_CERTIFICATE_PFX not set — skipping code signing."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:PFX_PASS)) {
            Write-Error "Set WINDOWS_CERTIFICATE_PASSWORD when WINDOWS_CERTIFICATE_PFX is configured."
            exit 1
          }
          $certPath = Join-Path $env:RUNNER_TEMP "wirepn-sign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:PFX_B64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found (install Windows SDK on runner)" }
          $toSign = [System.Collections.Generic.HashSet[string]]::new()
          $unpacked = "release/win-unpacked/WirePN.exe"
          if (Test-Path $unpacked) { [void]$toSign.Add((Resolve-Path $unpacked).Path) }
          Get-ChildItem -Path release -Filter "*.exe" -File -ErrorAction SilentlyContinue | ForEach-Object { [void]$toSign.Add($_.FullName) }
          foreach ($f in $toSign) {
            Write-Host "Signing: $f"
            & $signtool sign /f $certPath /p $env:PFX_PASS /fd sha256 /tr http://timestamp.digicert.com /td sha256 $f
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: List release directory
        shell: pwsh
        run: |
          if (-not (Test-Path release)) { Write-Error "release/ missing"; exit 1 }
          Get-ChildItem -Path release -Force | Format-Table Name, Length -AutoSize

      - name: Verify installer exists
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem -Path release -Filter *.exe -File -ErrorAction SilentlyContinue)
          if ($exe.Count -lt 1) {
            Write-Error "No .exe in release/. NSIS build did not produce an installer — check Build step logs."
            exit 1
          }
          Write-Host "OK: $($exe[0].Name)"

      # Text on the GitHub Release page + optional copy of RELEASE_NOTES_<semver>.md as an asset.
      - name: Prepare release notes (from RELEASE_NOTES_<version>.md)
        id: relnotes
        shell: pwsh
        run: |
          $v = (node -p "require('./package.json').version")
          $src = "RELEASE_NOTES_$v.md"
          $body = "RELEASE_BODY_FOR_GITHUB.md"
          if (Test-Path $src) {
            Copy-Item -Path $src -Destination $body -Force
            "has_notes_file=true" >> $env:GITHUB_OUTPUT
            "notes_path=$src" >> $env:GITHUB_OUTPUT
            Write-Host "Using $src as release body and optional asset."
          } else {
            $fallback = "## WirePN $v`n`nNo ``RELEASE_NOTES_$v.md`` in this commit — see ``CHANGELOG.md``."
            Set-Content -Path $body -Value $fallback -Encoding utf8
            "has_notes_file=false" >> $env:GITHUB_OUTPUT
            Write-Host "No RELEASE_NOTES_$v.md — placeholder body only."
          }

      - name: Create GitHub Release (installer + description)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_BODY_FOR_GITHUB.md
          files: release/*.exe
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach RELEASE_NOTES_*.md as download
        if: steps.relnotes.outputs.has_notes_file == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          $f = "${{ steps.relnotes.outputs.notes_path }}"
          gh release upload $tag $f --clobber --repo "${{ github.repository }}"

      - name: Upload blockmap if present
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          $bm = Get-ChildItem -Path release -Filter *.blockmap -File -ErrorAction SilentlyContinue
          if ($bm.Count -eq 0) {
            Write-Host "No .blockmap in release/ — skipping (optional for future auto-update)."
            exit 0
          }
          foreach ($f in $bm) {
            gh release upload $tag $f.FullName --clobber --repo "${{ github.repository }}"
          }
